<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paramètres | E-Tech Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .dashboard { padding: 24px; }
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .settings-card { background: white; padding: 24px; border-radius: 12px; }
        .settings-card h3 { margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #eee; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; }
        .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; min-height: 100px; }
        .toggle { display: flex; align-items: center; gap: 12px; }
        .toggle input { width: auto; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header__content">
            <a href="index.html" class="header__logo"><span>⚡ E-Tech Admin</span></a>
            <nav class="header__nav">
                <a href="dashboard.html">📊 Aperçu</a>
                <a href="dashboard-orders.html">📦 Commandes</a>
                <a href="dashboard-ai.html">💬 IA</a>
                <a href="dashboard-settings.html" class="active">⚙️ Paramètres</a>
            </nav>
        </div>
    </header>

    <section class="dashboard">
        <div class="container">
            <h1>⚙️ Paramètres</h1>
            
            <div class="settings-grid">
                <!-- Boutique -->
                <div class="settings-card">
                    <h3>🏪 Informations Boutique</h3>
                    <div class="form-group">
                        <label>Nom de la boutique</label>
                        <input type="text" value="E-Tech">
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea>Boutique d'électronique premium au Bénin</textarea>
                    </div>
                    <div class="form-group">
                        <label>Téléphone</label>
                        <input type="text" value="+229 01 977 003 47">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" value="support@e-tech.bj">
                    </div>
                    <div class="form-group">
                        <label>Adresse</label>
                        <textarea>Cotonou, Bénin</textarea>
                    </div>
                </div>
                
                <!-- IA -->
                <div class="settings-card">
                    <h3>🤖 Configuration IA</h3>
                    <div class="form-group">
                        <label>Modèle IA</label>
                        <select>
                            <option>Llama 3.1 8B</option>
                            <option>Qwen 2.5 Coder</option>
                            <option>Phi 3 Mini</option>
                        </select>
                    </div>
                    <div class="form-group toggle">
                        <input type="checkbox" id="ai-auto" checked>
                        <label for="ai-auto">Réponses automatiques IA</label>
                    </div>
                    <div class="form-group toggle">
                        <input type="checkbox" id="ai-human">
                        <label for="ai-human">Escalade vers humain</label>
                    </div>
                    <div class="form-group">
                        <label>Température (créativité)</label>
                        <input type="range" min="0" max="1" step="0.1" value="0.7">
                    </div>
                </div>
                
                <!-- Paiements -->
                <div class="settings-card">
                    <h3>💳 Paiements</h3>
                    <div class="form-group">
                        <label>Mode Stripe</label>
                        <select>
                            <option>Test</option>
                            <option>Production</option>
                        </select>
                    </div>
                    <div class="form-group toggle">
                        <input type="checkbox" id="stripe-enable">
                        <label for="stripe-enable">Activer Stripe</label>
                    </div>
                    <div class="form-group toggle">
                        <input type="checkbox" id="momo-enable" checked>
                        <label for="momo-enable">Mobile Money (MTN/Moov)</label>
                    </div>
                </div>
                
                <!-- Livraison -->
                <div class="settings-card">
                    <h3>🚚 Livraison</h3>
                    <div class="form-group">
                        <label>Livraison gratuite dès (FCA)</label>
                        <input type="number" value="50000">
                    </div>
                    <div class="form-group">
                        <label>Frais de livraison (FCA)</label>
                        <input type="number" value="5000">
                    </div>
                    <div class="form-group toggle">
                        <input type="checkbox" id="intl-enable">
                        <label for="intl-enable">Livraison internationale</label>
                    </div>
                </div>
            </div>
            
            <button class="btn btn--primary" style="margin-top: 24px;">Enregistrer les modifications</button>
        </div>
    </section>
</body>
</html>
