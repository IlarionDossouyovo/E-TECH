<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP - E-Tech</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0f; color: #fff; }
        header { background: linear-gradient(90deg, #1a1a2e, #16213e); padding: 20px 40px; display: flex; justify-content: space-between; }
        .logo { font-size: 24px; font-weight: bold; background: linear-gradient(90deg, #00d4ff, #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .container { max-width: 1400px; margin: 0 auto; padding: 40px 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: linear-gradient(135deg, #1a1a2e, #0f0f1a); border-radius: 12px; padding: 24px; text-align: center; }
        .stat-value { font-size: 32px; font-weight: bold; color: #00d4ff; }
        .stat-label { color: #888; margin-top: 8px; }
        .stat-card.warning .stat-value { color: #f59e0b; }
        .section-title { font-size: 24px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 16px; text-align: left; border-bottom: 1px solid #333; }
        th { background: #1a1a2e; color: #00d4ff; }
        tr:hover { background: #1a1a2e; }
        .low-stock { color: #ef4444; }
    </style>
</head>
<body>
    <header>
        <div class="logo">📦 E-Tech ERP</div>
        <a href="dashboard.html" style="color: #fff; text-decoration: none;">← Dashboard</a>
    </header>
    <div class="container">
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-value" id="total-revenue">0</div><div class="stat-label">Revenus Total</div></div>
            <div class="stat-card"><div class="stat-value" id="total-orders">0</div><div class="stat-label">Commandes</div></div>
            <div class="stat-card"><div class="stat-value" id="total-products">0</div><div class="stat-label">Produits</div></div>
            <div class="stat-card warning"><div class="stat-value" id="low-stock-count">0</div><div class="stat-label">Stock Faible</div></div>
        </div>
        <h2 class="section-title">Inventaire</h2>
        <table>
            <thead><tr><th>SKU</th><th>Produit</th><th>Quantité</th><th>Min Stock</th><th>Prix</th><th>Statut</th></tr></thead>
            <tbody id="inventory-list"></tbody>
        </table>
        <h2 class="section-title" style="margin-top: 40px;">Commandes Récentes</h2>
        <table>
            <thead><tr><th>ID</th><th>Total</th><th>Statut</th><th>Date</th></tr></thead>
            <tbody id="orders-list"></tbody>
        </table>
    </div>
    <script>
        const API = 'http://localhost:3001/api';
        async function loadERP() {
            try {
                // Dashboard
                const dashRes = await fetch(`${API}/erp/dashboard`);
                const dash = await dashRes.json();
                document.getElementById('total-revenue').textContent = dash.revenue.toLocaleString();
                document.getElementById('total-orders').textContent = dash.orders;
                document.getElementById('total-products').textContent = dash.inventory.total;
                document.getElementById('low-stock-count').textContent = dash.lowStock;
                
                // Inventory
                const invRes = await fetch(`${API}/erp/inventory`);
                const inv = await invRes.json();
                document.getElementById('inventory-list').innerHTML = inv.inventory.map(i => `
                    <tr>
                        <td>${i.sku}</td>
                        <td>${i.product}</td>
                        <td>${i.quantity}</td>
                        <td>${i.minStock}</td>
                        <td>${i.price.toLocaleString()} XOF</td>
                        <td class="${i.quantity <= i.minStock ? 'low-stock' : ''}">${i.quantity <= i.minStock ? '⚠️ Faible' : '✓ OK'}</td>
                    </tr>
                `).join('');
                
                // Orders
                const ordRes = await fetch(`${API}/erp/orders`);
                const ord = await ordRes.json();
                document.getElementById('orders-list').innerHTML = ord.orders.map(o => `
                    <tr>
                        <td>#${o.id}</td>
                        <td>${o.total.toLocaleString()} XOF</td>
                        <td>${o.status}</td>
                        <td>${o.createdAt}</td>
                    </tr>
                `).join('');
            } catch(e) { console.log(e); }
        }
        loadERP();
    </script>
</body>
</html>
