<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics | E-Tech Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .dashboard { padding: 24px; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; margin-bottom: 32px; }
        .stat-card { background: white; padding: 24px; border-radius: 12px; text-align: center; }
        .stat-card__value { font-size: 32px; font-weight: 700; }
        .stat-card__label { font-size: 14px; color: #666; }
        .chart-box { background: white; padding: 24px; border-radius: 12px; margin-bottom: 24px; }
        .chart-placeholder { height: 300px; background: linear-gradient(135deg, #f0f0f0 0%, #e0e0e0 100%); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #666; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header__content">
            <a href="index.html" class="header__logo"><span>⚡ E-Tech Admin</span></a>
            <nav class="header__nav">
                <a href="dashboard.html">📊 Aperçu</a>
                <a href="dashboard-orders.html">📦 Commandes</a>
                <a href="dashboard-ai.html" class="active">📈 Analytics</a>
                <a href="dashboard-settings.html">⚙️</a>
            </nav>
        </div>
    </header>

    <section class="dashboard">
        <div class="container">
            <h1>📈 Analytics et Statistiques</h1>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-card__value">2.4M</div>
                    <div class="stat-card__label">Revenus ce mois</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card__value">156</div>
                    <div class="stat-card__label">Commandes</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card__value">89%</div>
                    <div class="stat-card__label">Taux conversion</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card__value">4.8</div>
                    <div class="stat-card__label">Note moyenne</div>
                </div>
            </div>

            <div class="chart-box">
                <h3>Revenus par jour (30 derniers jours)</h3>
                <div class="chart-placeholder">📊 Graphique des revenus</div>
            </div>
            
            <div class="chart-box">
                <h3>Top Produits</h3>
                <div class="chart-placeholder">📈 Graphique des produits</div>
            </div>
        </div>
    </section>
</body>
</html>
