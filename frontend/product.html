<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta id="product-title" name="description" content="E-Tech - Produit premium">
    <title>Produit | E-Tech</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .product-detail { padding: 48px 0; }
        .product-detail__grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; }
        .product-detail__gallery { position: sticky; top: 100px; }
        .product-detail__main-image { 
            width: 100%; aspect-ratio: 1; 
            background: var(--gris-fonce); 
            border-radius: 16px; 
            display: flex; align-items: center; justify-content: center;
            font-size: 120px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .product-detail__thumbnails { 
            display: flex; gap: 12px; 
            margin-top: 16px; 
        }
        .product-detail__thumbnail {
            width: 80px; height: 80px;
            background: var(--gris-fonce);
            border-radius: 8px;
            border: 2px solid transparent;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .product-detail__thumbnail.active { border-color: var(--bleu-electrique); }
        .product-detail__info h1 { font-size: 32px; margin-bottom: 16px; }
        .product-detail__price { font-size: 36px; font-weight: 700; margin: 24px 0; }
        .product-detail__price-old { font-size: 20px; color: var(--gris-clair); text-decoration: line-through; margin-left: 12px; }
        .product-detail__desc { color: var(--gris-clair); line-height: 1.8; margin: 24px 0; }
        .product-detail__features { margin: 32px 0; }
        .product-detail__features h3 { margin-bottom: 16px; }
        .product-detail__features ul { list-style: none; }
        .product-detail__features li { 
            padding: 8px 0; 
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; gap: 12px;
        }
        .product-detail__features li::before { content: "✓"; color: var(--success); }
        .product-detail__quantity { 
            display: flex; align-items: center; gap: 16px; 
            margin: 24px 0; 
        }
        .quantity-btn {
            width: 40px; height: 40px;
            background: var(--gris-fonce);
            border: 1px solid var(--gris-moyen);
            border-radius: 8px;
            color: var(--blanc);
            font-size: 20px;
            cursor: pointer;
        }
        .quantity-value { font-size: 20px; font-weight: 600; min-width: 40px; text-align: center; }
        .product-detail__actions { display: flex; gap: 16px; margin-top: 32px; }
        .product-detail__actions .btn { flex: 1; }
        .similar-products { margin-top: 64px; }
        .similar-products h2 { margin-bottom: 24px; }
        .similar-products__grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
        
        @media (max-width: 768px) {
            .product-detail__grid { grid-template-columns: 1fr; }
            .similar-products__grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="container header__content">
            <a href="index.html" class="header__logo">
                <div class="header__logo-icon">⚡</div>
                <span>E-Tech</span>
            </a>
            <nav class="header__nav">
                <a href="index.html">Accueil</a>
                <a href="products.html">Produits</a>
                <a href="contact.html">Contact</a>
            </nav>
            <div class="header__actions">
                <a href="cart.html" class="header__cart">🛒 <span class="cart-count">0</span></a>
            </div>
        </div>
    </header>

    <section class="product-detail">
        <div class="container">
            <!-- Breadcrumb -->
            <div style="margin-bottom: 24px; color: var(--gris-clair);">
                <a href="index.html" style="color: var(--gris-clair);">Accueil</a> 
                <span> / </span>
                <a href="products.html" id="breadcrumb-category" style="color: var(--gris-clair);">Catégorie</a>
                <span> / </span>
                <span id="breadcrumb-name" style="color: var(--blanc);">Produit</span>
            </div>
            
            <div class="product-detail__grid">
                <!-- Gallery -->
                <div class="product-detail__gallery">
                    <div class="product-detail__main-image" id="main-image">📦</div>
                    <div class="product-detail__thumbnails" id="thumbnails"></div>
                </div>
                
                <!-- Info -->
                <div class="product-detail__info">
                    <h1 id="product-name">Produit</h1>
                    <div class="product-detail__price">
                        <span id="product-price">$0</span>
                        <span class="product-detail__price-old" id="product-price-old"></span>
                    </div>
                    
                    <p class="product-detail__desc" id="product-desc"></p>
                    
                    <div class="product-detail__features">
                        <h3>Caractéristiques</h3>
                        <ul id="product-features"></ul>
                    </div>
                    
                    <div class="product-detail__quantity">
                        <span>Quantité:</span>
                        <button class="quantity-btn" onclick="changeQuantity(-1)">-</button>
                        <span class="quantity-value" id="quantity">1</span>
                        <button class="quantity-btn" onclick="changeQuantity(1)">+</button>
                    </div>
                    
                    <div class="product-detail__actions">
                        <button class="btn btn--primary" onclick="addToCartDetail()">
                            Ajouter au Panier
                        </button>
                        <button class="btn btn--secondary" onclick="addToWishlist()">
                            ♡ Wishlist
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Similar Products -->
            <div class="similar-products">
                <h2>Produits Similaires</h2>
                <div class="similar-products__grid" id="similar-grid"></div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer__bottom">
                <p class="footer__copyright">© 2026 E-Tech. Tous droits réservés.</p>
            </div>
        </div>
    </footer>

    <script src="js/products-data.js"></script>
    <script src="js/main.js"></script>
    <script>
        let currentProduct = null;
        let quantity = 1;
        
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const productId = params.get('id');
            
            if (productId && typeof products !== 'undefined') {
                currentProduct = products.find(p => p.id === productId);
                if (currentProduct) {
                    renderProduct(currentProduct);
                    renderSimilar(currentProduct);
                }
            }
            
            if (!currentProduct) {
                document.querySelector('.product-detail').innerHTML = 
                    '<div class="container"><h1>Produit non trouvé</h1><a href="products.html" class="btn">Voir tous les produits</a></div>';
            }
        });
        
        function renderProduct(product) {
            document.getElementById('product-title').content = product.name + ' - E-Tech';
            document.title = product.name + ' | E-Tech';
            
            document.getElementById('main-image').textContent = '📦';
            document.getElementById('product-name').textContent = product.name;
            document.getElementById('product-price').textContent = '$' + product.price;
            document.getElementById('product-desc').textContent = product.description;
            
            if (product.originalPrice) {
                document.getElementById('product-price-old').textContent = '$' + product.originalPrice;
            }
            
            document.getElementById('breadcrumb-category').textContent = product.category;
            document.getElementById('breadcrumb-name').textContent = product.name;
            
            // Features
            const featuresEl = document.getElementById('product-features');
            if (product.features) {
                featuresEl.innerHTML = product.features.map(f => `<li>${f}</li>`).join('');
            }
            
            // Thumbnails
            const thumbsEl = document.getElementById('thumbnails');
            thumbsEl.innerHTML = (product.images || ['/images/products/placeholder.svg'])
                .map((img, i) => `<div class="product-detail__thumbnail ${i===0?'active':''}" onclick="changeImage(${i})">📦</div>`)
                .join('');
        }
        
        function renderSimilar(product) {
            const similar = products.filter(p => p.category === product.category && p.id !== product.id).slice(0, 4);
            const grid = document.getElementById('similar-grid');
            
            grid.innerHTML = similar.map(p => `
                <div class="product-card" onclick="window.location.href='product.html?id=${p.id}'">
                    <div class="product-card__image">📦</div>
                    <div class="product-card__content">
                        <h4>${p.name}</h4>
                        <p>$${p.price}</p>
                    </div>
                </div>
            `).join('');
        }
        
        function changeQuantity(delta) {
            quantity = Math.max(1, quantity + delta);
            document.getElementById('quantity').textContent = quantity;
        }
        
        function changeImage(index) {
            document.querySelectorAll('.product-detail__thumbnail').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });
        }
        
        function addToCartDetail() {
            if (currentProduct) {
                for (let i = 0; i < quantity; i++) {
                    addToCart(currentProduct.id);
                }
                alert(`${currentProduct.name} x${quantity} ajouté au panier!`);
            }
        }
        
        function addToWishlist() {
            alert('Ajouté à la wishlist!');
        }
    </script>
</body>
</html>
