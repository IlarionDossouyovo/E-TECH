<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - E-Tech Global</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0f; color: #fff; }
        header { background: linear-gradient(90deg, #1a1a2e, #16213e); padding: 20px 40px; display: flex; justify-content: space-between; }
        .logo { font-size: 24px; font-weight: bold; background: linear-gradient(90deg, #00d4ff, #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero { text-align: center; padding: 80px 20px; background: linear-gradient(180deg, #0a0a0f, #1a1a2e); }
        .hero h1 { font-size: 48px; margin-bottom: 20px; }
        .hero h1 span { background: linear-gradient(90deg, #00d4ff, #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        .categories { display: flex; gap: 16px; margin-bottom: 40px; flex-wrap: wrap; }
        .cat-btn { padding: 12px 24px; background: #1a1a2e; border: 1px solid #333; border-radius: 8px; color: #fff; cursor: pointer; transition: 0.3s; }
        .cat-btn:hover, .cat-btn.active { background: linear-gradient(90deg, #00d4ff, #7c3aed); border-color: transparent; }
        .articles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 24px; }
        .article-card { background: linear-gradient(135deg, #1a1a2e, #0f0f1a); border-radius: 16px; overflow: hidden; border: 1px solid #333; }
        .article-image { height: 200px; background: linear-gradient(135deg, #1a1a2e, #16213e); display: flex; align-items: center; justify-content: center; font-size: 64px; }
        .article-content { padding: 24px; }
        .article-category { color: #00d4ff; font-size: 12px; text-transform: uppercase; margin-bottom: 8px; }
        .article-title { font-size: 20px; font-weight: 600; margin-bottom: 12px; }
        .article-excerpt { color: #888; font-size: 14px; margin-bottom: 16px; }
        .article-meta { display: flex; justify-content: space-between; color: #666; font-size: 12px; }
        footer { text-align: center; padding: 40px; color: #666; margin-top: 60px; border-top: 1px solid #222; }
    </style>
</head>
<body>
    <header>
        <div class="logo">✍️ E-Tech Blog</div>
        <nav><a href="index.html" style="color: #fff; text-decoration: none;">Accueil</a></nav>
    </header>
    <section class="hero">
        <h1>Blog <span>E-Tech</span></h1>
        <p>Actualités, guides et comparatifs sur l'électronique, le gaming et la tech</p>
    </section>
    <div class="container">
        <div class="categories">
            <button class="cat-btn active" onclick="filterCat('all')">Tous</button>
            <button class="cat-btn" onclick="filterCat('smartphones')">Smartphones</button>
            <button class="cat-btn" onclick="filterCat('gaming')">Gaming</button>
            <button class="cat-btn" onclick="filterCat('gsm')">GSM Repair</button>
            <button class="cat-btn" onclick="filterCat('smarthome')">Smart Home</button>
            <button class="cat-btn" onclick="filterCat('security')">Security</button>
        </div>
        <div class="articles-grid" id="articles"></div>
    </div>
    <footer><p>© 2026 E-Tech Blog | Cotonou, Benin</p></footer>
    <script>
        const articles = [
            { id: 1, category: 'smartphones', title: 'iPhone 16 Pro vs Samsung S25 Ultra', excerpt: 'Comparatif complet des deux flagships 2026...', date: '20 Aoû 2026', icon: '📱' },
            { id: 2, category: 'gaming', title: 'Setup Gaming Complet 2026', excerpt: 'Guide pour créer le bureau gaming parfait...', date: '18 Aoû 2026', icon: '🎮' },
            { id: 3, category: 'gsm', title: 'Réparer son écran', excerpt: 'Tuto: comment remplacer un écran HS...', date: '15 Aoû 2026', icon: '🔧' },
            { id: 4, category: 'smarthome', title: 'Maison Connectée pas cher', excerpt: 'Automatisez votre domicile avec un petit budget...', date: '12 Aoû 2026', icon: '🏠' },
            { id: 5, category: 'security', title: 'Caméra de surveillance: Guide', excerpt: 'Choisir et installer son système de vidéosurveillance...', date: '10 Aoû 2026', icon: '🔒' },
            { id: 6, category: 'smartphones', title: 'Meilleur smartphone 2026', excerpt: 'Notre sélection des tops phones par budget...', date: '08 Aoû 2026', icon: '📱' }
        ];
        
        function filterCat(cat) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            
            const filtered = cat === 'all' ? articles : articles.filter(a => a.category === cat);
            document.getElementById('articles').innerHTML = filtered.map(a => `
                <div class="article-card">
                    <div class="article-image">${a.icon}</div>
                    <div class="article-content">
                        <div class="article-category">${a.category}</div>
                        <div class="article-title">${a.title}</div>
                        <div class="article-excerpt">${a.excerpt}</div>
                        <div class="article-meta"><span>${a.date}</span><span>Lire plus →</span></div>
                    </div>
                </div>
            `).join('');
        }
        
        filterCat('all');
    </script>
</body>
</html>
