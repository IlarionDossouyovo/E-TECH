<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="E-Tech - Tous nos produits électroniques premium">
    <title>Tous les Produits | E-Tech</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="images/logo.svg">
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="container header__content">
            <a href="index.html" class="header__logo">
                <div class="header__logo-icon">⚡</div>
                <span>E-Tech</span>
            </a>
            
            <nav class="header__nav">
                <a href="index.html">Accueil</a>
                <a href="products.html?category=electronics">Electronics</a>
                <a href="products.html?category=wearables">Wearables</a>
                <a href="products.html?category=smart-home">Smart Home</a>
                <a href="products.html?category=decoration">Décoration</a>
                <a href="products.html?category=accessories">Accessoires</a>
                <a href="products.html?category=promotions">Promotions</a>
                <a href="blog.html">Blog</a>
                <a href="contact.html">Contact</a>
            </nav>
            
            <div class="header__actions">
                <a href="cart.html" class="header__cart">
                    🛒
                    <span class="cart-count" id="cart-count">0</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Products Page -->
    <section style="padding: 48px 0; background: var(--noir);">
        <div class="container">
            <h1 style="margin-bottom: 32px;">Nos <span class="gradient-text">Produits</span></h1>
            
            <div style="display: grid; grid-template-columns: 280px 1fr; gap: 32px;">
                <!-- Filters Sidebar -->
                <aside style="background: var(--gris-fonce); padding: 24px; border-radius: 12px; height: fit-content; position: sticky; top: 100px; border: 1px solid rgba(255,255,255,0.1);">
                    <h3 style="margin-bottom: 24px;">Filtres</h3>
                    
                    <!-- Search -->
                    <div style="margin-bottom: 24px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--blanc);">Rechercher</label>
                        <input type="text" id="search-input" placeholder="Nom du produit..." style="width: 100%; padding: 12px; border: 1px solid var(--gris-moyen); border-radius: 8px; background: var(--noir); color: var(--blanc);">
                    </div>
                    
                    <!-- Categories -->
                    <div style="margin-bottom: 24px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--blanc);">Catégorie</label>
                        <select id="category-filter" style="width: 100%; padding: 12px; border: 1px solid var(--gris-moyen); border-radius: 8px; background: var(--noir); color: var(--blanc);">
                            <option value="">Toutes les catégories</option>
                            <option value="electronics">Electronics</option>
                            <option value="wearables">Smart Wearables</option>
                            <option value="smart-home">Smart Home</option>
                            <option value="decoration">Décoration Tech</option>
                            <option value="accessories">Accessoires Téléphone</option>
                            <option value="promotions">Promotions</option>
                        </select>
                    </div>
                    
                    <!-- Price Range -->
                    <div style="margin-bottom: 24px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--blanc);">Prix (USD)</label>
                        <div style="display: flex; gap: 8px;">
                            <input type="number" id="price-min" placeholder="Min" style="width: 100%; padding: 12px; border: 1px solid var(--gris-moyen); border-radius: 8px; background: var(--noir); color: var(--blanc);">
                            <input type="number" id="price-max" placeholder="Max" style="width: 100%; padding: 12px; border: 1px solid var(--gris-moyen); border-radius: 8px; background: var(--noir); color: var(--blanc);">
                        </div>
                    </div>
                    
                    <!-- Subcategory -->
                    <div style="margin-bottom: 24px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--blanc);">Sous-catégorie</label>
                        <select id="subcategory-filter" style="width: 100%; padding: 12px; border: 1px solid var(--gris-moyen); border-radius: 8px; background: var(--noir); color: var(--blanc);">
                            <option value="">Toutes</option>
                        </select>
                    </div>
                    
                    <button class="btn btn--primary" style="width: 100%;" onclick="applyFilters()">
                        Appliquer les Filtres
                    </button>
                </aside>
                
                <!-- Products Grid -->
                <div>
                    <!-- Sort & Results -->
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; color: var(--blanc);">
                        <p id="results-count"><span id="count">0</span> produits</p>
                        <select id="sort-select" style="padding: 12px; border: 1px solid var(--gris-moyen); border-radius: 8px; background: var(--noir); color: var(--blanc);" onchange="sortProducts()">
                            <option value="relevance">Pertinence</option>
                            <option value="price-asc">Prix: Croissant</option>
                            <option value="price-desc">Prix: Décroissant</option>
                            <option value="name-asc">Nom: A-Z</option>
                        </select>
                    </div>
                    
                    <!-- Products -->
                    <div class="products__grid" id="products-grid">
                        <!-- Dynamic products loaded here -->
                    </div>
                    
                    <!-- Pagination -->
                    <div style="display: flex; justify-content: center; gap: 8px; margin-top: 48px;">
                        <button class="btn btn--secondary">← Précédent</button>
                        <button class="btn btn--primary">1</button>
                        <button class="btn btn--secondary">2</button>
                        <button class="btn btn--secondary">3</button>
                        <button class="btn btn--secondary">Suivant →</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer__bottom">
                <p class="footer__copyright">© 2025 E-Tech. Tous droits réservés. | E-Tech SARL - Cotonou, Bénin</p>
                <div class="footer__legal">
                    <a href="#">CGV</a>
                    <a href="#">Mentions Légales</a>
                    <a href="#">Politique RGPD</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="js/products-data.js"></script>
    <script src="js/main.js"></script>
    <script>
        // Load products on page load
        document.addEventListener('DOMContentLoaded', () => {
            // Get category from URL
            const params = new URLSearchParams(window.location.search);
            const category = params.get('category');
            
            // Filter and render products
            let filtered = products;
            if (category) {
                filtered = products.filter(p => p.category === category);
            }
            
            renderProducts(filtered);
            updateCount(filtered.length);
            
            // Setup filter listeners
            document.getElementById('category-filter').addEventListener('change', applyFilters);
            document.getElementById('search-input').addEventListener('input', applyFilters);
        });
        
        function renderProducts(productsList) {
            const grid = document.getElementById('products-grid');
            if (!grid) return;
            
            grid.innerHTML = productsList.map(product => `
                <div class="product-card" onclick="viewProduct('${product.id}')">
                    <div class="product-card__image">
                        <img src="${product.images[0]}" alt="${product.name}" style="width: 100%; aspect-ratio: 1; object-fit: cover;">
                    </div>
                    <div class="product-card__content">
                        <h3 class="product-card__name">${product.name}</h3>
                        <p class="product-card__price">
                            <span class="product-card__price-current">$${product.price}</span>
                            ${product.originalPrice ? `<span class="product-card__price-old">$${product.originalPrice}</span>` : ''}
                        </p>
                        <button class="product-card__btn" onclick="event.stopPropagation(); addToCartFromProduct('${product.id}')">
                            Ajouter au Panier
                        </button>
                    </div>
                </div>
            `).join('');
        }
        
        function updateCount(count) {
            const countEl = document.getElementById('count');
            if (countEl) countEl.textContent = count;
        }
        
        function applyFilters() {
            let filtered = [...products];
            
            // Category filter
            const category = document.getElementById('category-filter')?.value;
            if (category) {
                filtered = filtered.filter(p => p.category === category);
            }
            
            // Search filter
            const search = document.getElementById('search-input')?.value.toLowerCase();
            if (search) {
                filtered = filtered.filter(p => 
                    p.name.toLowerCase().includes(search) ||
                    p.description?.toLowerCase().includes(search)
                );
            }
            
            renderProducts(filtered);
            updateCount(filtered.length);
        }
        
        function sortProducts() {
            const sort = document.getElementById('sort-select')?.value;
            let filtered = [...products];
            
            if (sort === 'price-asc') {
                filtered.sort((a, b) => a.price - b.price);
            } else if (sort === 'price-desc') {
                filtered.sort((a, b) => b.price - a.price);
            } else if (sort === 'name-asc') {
                filtered.sort((a, b) => a.name.localeCompare(b.name));
            }
            
            renderProducts(filtered);
        }
        
        function addToCartFromProduct(productId) {
            const product = products.find(p => p.id === productId);
            if (product) {
                addToCart(productId);
                alert(`${product.name} ajouté au panier!`);
            }
        }
        
        function viewProduct(productId) {
            // Could navigate to product detail page
            console.log('View product:', productId);
        }
    </script>
</body>
</html>
