<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <!-- Presentation Background -->
  <rect width="1200" height="800" fill="#0A0A0A"/>
  
  <!-- Title -->
  <text x="600" y="60" font-family="Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle" letter-spacing="3">BRAND IDENTITY SYSTEM</text>
  
  <!-- Logo Version 1: Minimal Dark -->
  <g transform="translate(100, 120)">
    <rect width="320" height="180" rx="12" fill="#111111"/>
    <text x="160" y="30" font-family="Arial, sans-serif" font-size="10" fill="#444444" text-anchor="middle">PRIMARY / DARK</text>
    <g transform="translate(60, 50)">
      <path d="M 45 0 L 85 15 L 85 65 L 45 80 L 5 65 L 5 15 Z" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <path d="M 22 18 L 22 62" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
      <path d="M 22 18 L 50 18" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
      <path d="M 22 40 L 45 40" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
      <path d="M 22 62 L 50 62" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
      <circle cx="50" cy="18" r="3" fill="#00D4FF"/>
      <circle cx="45" cy="40" r="3" fill="#00D4FF"/>
      <circle cx="50" cy="62" r="3" fill="#8B5CF6"/>
    </g>
    <text x="160" y="155" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#FFFFFF" text-anchor="middle">
      <tspan>E</tspan><tspan fill="#00D4FF">-</tspan><tspan>Tech</tspan>
    </text>
  </g>
  
  <!-- Logo Version 2: Minimal Light -->
  <g transform="translate(440, 120)">
    <rect width="320" height="180" rx="12" fill="#F5F5F5"/>
    <text x="160" y="30" font-family="Arial, sans-serif" font-size="10" fill="#AAAAAA" text-anchor="middle">PRIMARY / LIGHT</text>
    <g transform="translate(60, 50)">
      <path d="M 45 0 L 85 15 L 85 65 L 45 80 L 5 65 L 5 15 Z" fill="none" stroke="#0A0A0A" stroke-width="2"/>
      <path d="M 22 18 L 22 62" stroke="#0A0A0A" stroke-width="4" stroke-linecap="round"/>
      <path d="M 22 18 L 50 18" stroke="#0A0A0A" stroke-width="4" stroke-linecap="round"/>
      <path d="M 22 40 L 45 40" stroke="#0A0A0A" stroke-width="4" stroke-linecap="round"/>
      <path d="M 22 62 L 50 62" stroke="#0A0A0A" stroke-width="4" stroke-linecap="round"/>
      <circle cx="50" cy="18" r="3" fill="#0066AA"/>
      <circle cx="45" cy="40" r="3" fill="#0066AA"/>
      <circle cx="50" cy="62" r="3" fill="#5B21B6"/>
    </g>
    <text x="160" y="155" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#0A0A0A" text-anchor="middle">
      <tspan>E</tspan><tspan fill="#0066AA">-</tspan><tspan>Tech</tspan>
    </text>
  </g>
  
  <!-- Logo Version 3: Icon Only -->
  <g transform="translate(780, 120)">
    <rect width="320" height="180" rx="12" fill="#111111"/>
    <text x="160" y="30" font-family="Arial, sans-serif" font-size="10" fill="#444444" text-anchor="middle">ICON / FAVICON</text>
    <g transform="translate(110, 55)">
      <path d="M 45 0 L 85 15 L 85 65 L 45 80 L 5 65 L 5 15 Z" fill="none" stroke="#00D4FF" stroke-width="2"/>
      <path d="M 22 18 L 22 62" stroke="#00D4FF" stroke-width="4" stroke-linecap="round"/>
      <path d="M 22 18 L 50 18" stroke="#00D4FF" stroke-width="4" stroke-linecap="round"/>
      <path d="M 22 40 L 45 40" stroke="#00D4FF" stroke-width="4" stroke-linecap="round"/>
      <path d="M 22 62 L 50 62" stroke="#00D4FF" stroke-width="4" stroke-linecap="round"/>
      <circle cx="50" cy="18" r="3" fill="#00D4FF"/>
      <circle cx="45" cy="40" r="3" fill="#00D4FF"/>
      <circle cx="50" cy="62" r="3" fill="#8B5CF6"/>
    </g>
    <text x="160" y="155" font-family="Arial, sans-serif" font-size="24" fill="#00D4FF" text-anchor="middle">⚡ E-Tech</text>
  </g>
  
  <!-- Color Palette -->
  <g transform="translate(100, 340)">
    <text x="160" y="30" font-family="Arial, sans-serif" font-size="10" fill="#444444" text-anchor="middle">COLOR SYSTEM</text>
    <rect x="20" y="50" width="60" height="60" rx="4" fill="#00D4FF"/>
    <text x="50" y="95" font-family="Arial, sans-serif" font-size="8" fill="#FFFFFF" text-anchor="middle">BLUE</text>
    <text x="50" y="105" font-family="Arial, sans-serif" font-size="8" fill="#CCCCCC" text-anchor="middle">#00D4FF</text>
    
    <rect x="90" y="50" width="60" height="60" rx="4" fill="#8B5CF6"/>
    <text x="120" y="95" font-family="Arial, sans-serif" font-size="8" fill="#FFFFFF" text-anchor="middle">PURPLE</text>
    <text x="120" y="105" font-family="Arial, sans-serif" font-size="8" fill="#CCCCCC" text-anchor="middle">#8B5CF6</text>
    
    <rect x="160" y="50" width="60" height="60" rx="4" fill="#0A0A0A"/>
    <text x="190" y="95" font-family="Arial, sans-serif" font-size="8" fill="#FFFFFF" text-anchor="middle">NOIR</text>
    <text x="190" y="105" font-family="Arial, sans-serif" font-size="8" fill="#CCCCCC" text-anchor="middle">#0A0A0A</text>
    
    <rect x="230" y="50" width="60" height="60" rx="4" fill="#FFFFFF"/>
    <text x="260" y="95" font-family="Arial, sans-serif" font-size="8" fill="#0A0A0A" text-anchor="middle">WHITE</text>
    <text x="260" y="105" font-family="Arial, sans-serif" font-size="8" fill="#666666" text-anchor="middle">#FFFFFF</text>
  </g>
  
  <!-- Typography -->
  <g transform="translate(440, 340)">
    <text x="160" y="30" font-family="Arial, sans-serif" font-size="10" fill="#444444" text-anchor="middle">TYPOGRAPHY</text>
    <text x="30" y="70" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">Bold</text>
    <text x="30" y="100" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#FFFFFF">Semibold</text>
    <text x="30" y="125" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#CCCCCC">Regular</text>
  </g>
  
  <!-- App Mockup -->
  <g transform="translate(780, 340)">
    <rect width="320" height="180" rx="12" fill="#0A0A0A"/>
    <text x="160" y="30" font-family="Arial, sans-serif" font-size="10" fill="#444444" text-anchor="middle">APPLICATION</text>
    <g transform="translate(60, 50)">
      <path d="M 45 0 L 85 15 L 85 65 L 45 80 L 5 65 L 5 15 Z" fill="none" stroke="#00D4FF" stroke-width="1.5"/>
      <path d="M 22 18 L 22 62" stroke="#00D4FF" stroke-width="3" stroke-linecap="round"/>
      <path d="M 22 18 L 50 18" stroke="#00D4FF" stroke-width="3" stroke-linecap="round"/>
      <path d="M 22 40 L 45 40" stroke="#00D4FF" stroke-width="3" stroke-linecap="round"/>
      <path d="M 22 62 L 50 62" stroke="#00D4FF" stroke-width="3" stroke-linecap="round"/>
    </g>
    <rect x="20" y="130" width="280" height="30" rx="4" fill="#00D4FF"/>
    <text x="160" y="150" font-family="Arial, sans-serif" font-size="12" fill="#0A0A0A" text-anchor="middle" font-weight="600">SHOP NOW</text>
  </g>
  
  <!-- Footer -->
  <text x="600" y="760" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">© 2026 E-Tech • Premium Electronics • Cotonou, Benin</text>
  <text x="600" y="780" font-family="Arial, sans-serif" font-size="10" fill="#444444" text-anchor="middle">e-tech.bj</text>
</svg>