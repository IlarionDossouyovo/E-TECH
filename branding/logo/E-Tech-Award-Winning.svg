<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="50%" stop-color="#0D0D0D"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="50%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#heroGrad)"/>
  
  <!-- Subtle grid -->
  <g stroke="#1A1A1A" stroke-width="0.5">
    <line x1="0" y1="200" x2="1920" y2="200"/>
    <line x1="0" y1="400" x2="1920" y2="400"/>
    <line x1="0" y1="600" x2="1920" y2="600"/>
    <line x1="0" y1="800" x2="1920" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="1080"/>
    <line x1="800" y1="0" x2="800" y2="1080"/>
    <line x1="1200" y1="0" x2="1200" y2="1080"/>
    <line x1="1600" y1="0" x2="1600" y2="1080"/>
  </g>
  
  <!-- Hero Logo Center -->
  <g transform="translate(960, 400)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="#1A1A1A" stroke-width="1"/>
    <circle cx="0" cy="0" r="160" fill="none" stroke="url(#accentGrad)" stroke-width="1" opacity="0.3"/>
    
    <!-- Main E Symbol -->
    <g transform="translate(-120, -120) scale(3)">
      <path d="M 45 0 L 85 15 L 85 65 L 45 80 L 5 65 L 5 15 Z" fill="none" stroke="#FFFFFF" stroke-width="2" filter="url(#softGlow)"/>
      <path d="M 22 18 L 22 62" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
      <path d="M 22 18 L 50 18" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
      <path d="M 22 40 L 45 40" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
      <path d="M 22 62 L 50 62" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
      <circle cx="50" cy="18" r="4" fill="#00D4FF" filter="url(#softGlow)"/>
      <circle cx="45" cy="40" r="4" fill="#00D4FF" filter="url(#softGlow)"/>
      <circle cx="50" cy="62" r="4" fill="#8B5CF6" filter="url(#softGlow)"/>
    </g>
  </g>
  
  <!-- Brand Name -->
  <g transform="translate(960, 650)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="72" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      <tspan>E</tspan><tspan fill="#00D4FF">-</tspan><tspan>Tech</tspan>
    </text>
  </g>
  
  <!-- Tagline -->
  <g transform="translate(960, 720)">
    <rect x="-100" y="0" width="200" height="2" fill="url(#accentGrad)"/>
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="14" fill="#8B5CF6" text-anchor="middle" letter-spacing="8">PREMIUM ELECTRONICS</text>
  </g>
  
  <!-- Stats -->
  <g transform="translate(960, 850)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" fill="#666666" text-anchor="middle" letter-spacing="4">GLOBAL E-COMMERCE • SMART TECHNOLOGY • FUTURE INNOVATION</text>
  </g>
  
  <!-- Corner Accents -->
  <g fill="none" stroke="#00D4FF" stroke-width="2">
    <path d="M 50 30 L 50 50 L 70 50"/>
    <path d="M 1870 30 L 1870 50 L 1850 50"/>
    <path d="M 50 1050 L 50 1030 L 70 1030"/>
    <path d="M 1870 1050 L 1870 1030 L 1850 1030"/>
  </g>
  
  <!-- Bottom Info -->
  <text x="960" y="1020" font-family="Arial, sans-serif" font-size="14" fill="#444444" text-anchor="middle">e-tech.bj • Cotonou, Benin • 2026</text>
</svg>