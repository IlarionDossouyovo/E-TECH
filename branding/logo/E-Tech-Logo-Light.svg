<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#006699"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="120" fill="#FFFFFF"/>
  <g transform="translate(20, 15)">
    <polygon points="45,0 85,15 85,55 45,70 5,55 5,15" fill="none" stroke="url(#blueGrad)" stroke-width="2" filter="url(#glow)"/>
    <line x1="20" y1="15" x2="20" y2="55" stroke="#006699" stroke-width="3" filter="url(#glow)"/>
    <line x1="20" y1="15" x2="45" y2="15" stroke="#006699" stroke-width="3" filter="url(#glow)"/>
    <line x1="20" y1="35" x2="40" y2="35" stroke="#006699" stroke-width="3" filter="url(#glow)"/>
    <line x1="20" y1="55" x2="45" y2="55" stroke="#006699" stroke-width="3" filter="url(#glow)"/>
    <circle cx="45" cy="15" r="3" fill="#006699" filter="url(#glow)"/>
    <circle cx="45" cy="35" r="3" fill="#006699" filter="url(#glow)"/>
    <circle cx="45" cy="55" r="3" fill="#006699" filter="url(#glow)"/>
    <path d="M 50 35 Q 65 35 75 25" fill="none" stroke="#5B21B6" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.6"/>
    <path d="M 50 35 Q 65 35 75 45" fill="none" stroke="#5B21B6" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.6"/>
  </g>
  <text x="100" y="68" font-family="Arial, sans-serif" font-size="42" font-weight="700">
    <tspan fill="#0A0A0A">E</tspan><tspan fill="#006699">-</tspan><tspan fill="#0A0A0A">Tech</tspan>
  </text>
  <text x="102" y="88" font-family="Arial, sans-serif" font-size="10" fill="#5B21B6" letter-spacing="4" opacity="0.8">PREMIUM ELECTRONICS</text>
