<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#0099CC"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" fill="none"/>
  <g transform="translate(10, 10)">
    <polygon points="22,0 42,8 42,36 22,44 2,36 2,8" fill="none" stroke="url(#blueGrad)" stroke-width="1.5" filter="url(#glow)"/>
    <line x1="12" y1="10" x2="12" y2="34" stroke="#00D4FF" stroke-width="2" filter="url(#glow)"/>
    <line x1="12" y1="10" x2="28" y2="10" stroke="#00D4FF" stroke-width="2" filter="url(#glow)"/>
    <line x1="12" y1="22" x2="24" y2="22" stroke="#00D4FF" stroke-width="2" filter="url(#glow)"/>
    <line x1="12" y1="34" x2="28" y2="34" stroke="#00D4FF" stroke-width="2" filter="url(#glow)"/>
    <circle cx="28" cy="10" r="2" fill="#00D4FF"/>
    <circle cx="28" cy="22" r="2" fill="#00D4FF"/>
    <circle cx="28" cy="34" r="2" fill="#00D4FF"/>
  </g>
</svg>