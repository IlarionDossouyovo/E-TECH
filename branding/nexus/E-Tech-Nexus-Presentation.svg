<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- Premium Brand Presentation -->
  <rect width="1600" height="900" fill="#0A0A0A"/>
  
  <!-- Subtle grid -->
  <g stroke="#1A1A1A" stroke-width="0.5">
    <line x1="0" y1="150" x2="1600" y2="150"/>
    <line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="0" y1="450" x2="1600" y2="450"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="750" x2="1600" y2="750"/>
    <line x1="400" y1="0" x2="400" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="1200" y1="0" x2="1200" y2="900"/>
  </g>
  
  <!-- Title -->
  <text x="800" y="60" font-family="Arial, sans-serif" font-size="14" fill="#444444" text-anchor="middle" letter-spacing="4">BRAND IDENTITY SYSTEM</text>
  
  <!-- Main Logo - Center -->
  <g transform="translate(800, 200)">
    <circle cx="0" cy="0" r="80" fill="none" stroke="#1A1A1A" stroke-width="1"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="url(#nexusGrad)" stroke-width="1" opacity="0.3"/>
    
    <!-- Symbol -->
    <g transform="translate(-60, -60) scale(1.5)">
      <circle cx="40" cy="50" r="45" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="40" cy="50" r="12" fill="#FFFFFF"/>
      <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round">
        <line x1="40" y1="38" x2="40" y2="18"/>
        <line x1="52" y1="50" x2="72" y2="50"/>
        <line x1="40" y1="62" x2="40" y2="82"/>
        <line x1="28" y1="50" x2="8" y2="50"/>
      </g>
      <circle cx="40" cy="18" r="4" fill="#00D4FF"/>
      <circle cx="72" cy="50" r="4" fill="#00D4FF"/>
      <circle cx="40" cy="82" r="4" fill="#8B5CF6"/>
      <circle cx="8" cy="50" r="4" fill="#8B5CF6"/>
    </g>
  </g>
  
  <!-- Brand Name -->
  <text x="800" y="320" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <tspan>E-TechNexus</tspan><tspan fill="#00D4FF">AI</tspan>
  </text>
  <text x="800" y="345" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle" letter-spacing="6">INTELLIGENCE ECOSYSTEM</text>
  
  <!-- Color System -->
  <g transform="translate(200, 400)">
    <text x="200" y="0" font-family="Arial, sans-serif" font-size="12" fill="#444444" text-anchor="middle">COLOR SYSTEM</text>
    
    <!-- Colors -->
    <rect x="60" y="30" width="80" height="80" rx="8" fill="#00D4FF"/>
    <text x="100" y="80" font-family="Arial, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">Electric</text>
    <text x="100" y="95" font-family="Arial, sans-serif" font-size="10" fill="#CCCCCC" text-anchor="middle">Blue</text>
    <text x="100" y="108" font-family="Arial, sans-serif" font-size="9" fill="#999999" text-anchor="middle">#00D4FF</text>
    
    <rect x="160" y="30" width="80" height="80" rx="8" fill="#8B5CF6"/>
    <text x="200" y="80" font-family="Arial, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">Neon</text>
    <text x="200" y="95" font-family="Arial, sans-serif" font-size="10" fill="#CCCCCC" text-anchor="middle">Purple</text>
    <text x="200" y="108" font-family="Arial, sans-serif" font-size="9" fill="#999999" text-anchor="middle">#8B5CF6</text>
    
    <rect x="260" y="30" width="80" height="80" rx="8" fill="#0A0A0A" stroke="#333333" stroke-width="1"/>
    <text x="300" y="80" font-family="Arial, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">Deep</text>
    <text x="300" y="95" font-family="Arial, sans-serif" font-size="10" fill="#CCCCCC" text-anchor="middle">Black</text>
    <text x="300" y="108" font-family="Arial, sans-serif" font-size="9" fill="#999999" text-anchor="middle">#0A0A0A</text>
    
    <rect x="360" y="30" width="80" height="80" rx="8" fill="#C0C0C0"/>
    <text x="400" y="80" font-family="Arial, sans-serif" font-size="10" fill="#0A0A0A" text-anchor="middle">Metallic</text>
    <text x="400" y="95" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle">Silver</text>
    <text x="400" y="108" font-family="Arial, sans-serif" font-size="9" fill="#666666" text-anchor="middle">#C0C0C0</text>
  </g>
  
  <!-- Typography -->
  <g transform="translate(800, 400)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#444444" text-anchor="middle">TYPOGRAPHY</text>
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">Bold</text>
    <text x="0" y="85" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#FFFFFF">Semibold</text>
    <text x="0" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#CCCCCC">Regular</text>
  </g>
  
  <!-- Logo Versions -->
  <g transform="translate(200, 600)">
    <text x="200" y="0" font-family="Arial, sans-serif" font-size="12" fill="#444444" text-anchor="middle">LOGO VERSIONS</text>
    
    <!-- Dark -->
    <rect x="60" y="30" width="80" height="80" rx="8" fill="#0A0A0A"/>
    <text x="100" y="130" font-family="Arial, sans-serif" font-size="10" fill="#666666" text-anchor="middle">Dark</text>
    
    <!-- Light -->
    <rect x="160" y="30" width="80" height="80" rx="8" fill="#FFFFFF"/>
    <text x="200" y="130" font-family="Arial, sans-serif" font-size="10" fill="#666666" text-anchor="middle">Light</text>
    
    <!-- Icon -->
    <rect x="260" y="30" width="80" height="80" rx="8" fill="#111111"/>
    <text x="300" y="130" font-family="Arial, sans-serif" font-size="10" fill="#666666" text-anchor="middle">Icon</text>
  </g>
  
  <!-- App Mockup -->
  <g transform="translate(800, 600)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#444444" text-anchor="middle">APPLICATION</text>
    <rect x="-80" y="30" width="160" height="100" rx="12" fill="#0A0A0A" stroke="#333333" stroke-width="1"/>
    <text x="0" y="85" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">Mobile App</text>
    <text x="0" y="105" font-family="Arial, sans-serif" font-size="10" fill="#666666" text-anchor="middle">Ready</text>
  </g>
  
  <!-- Modules -->
  <g transform="translate(1200, 600)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#444444" text-anchor="middle">PLATFORM</text>
    <text x="0" y="40" font-family="Arial, sans-serif" font-size="11" fill="#00D4FF">● Diagnostic AI</text>
    <text x="0" y="60" font-family="Arial, sans-serif" font-size="11" fill="#00D4FF">● Repair GSM</text>
    <text x="0" y="80" font-family="Arial, sans-serif" font-size="11" fill="#00D4FF">● CRM</text>
    <text x="0" y="100" font-family="Arial, sans-serif" font-size="11" fill="#8B5CF6">● Marketplace</text>
  </g>
  
  <!-- Footer -->
  <text x="800" y="860" font-family="Arial, sans-serif" font-size="12" fill="#444444" text-anchor="middle">© 2026 E-Tech Nexus AI • Global Intelligence Ecosystem</text>
  <text x="800" y="885" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle">etechnexus.ai</text>
</svg>