# E-Tech Nexus AI Platform - Docker Compose
version: '3.8'

services:
  # Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: etech-nexus-api
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/etech
      - REDIS_URL=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./gsm-platform:/app
    restart: unless-stopped
    networks:
      - etech-network

  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: etech-nexus-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=etech
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - etech-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: etech-nexus-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - etech-network

  # Ollama AI (Local LLM)
  ollama:
    image: ollama/ollama:latest
    container_name: etech-nexus-ai
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    ports:
      - "11434:11434"
    restart: unless-stopped
    networks:
      - etech-network

  # Open WebUI (AI Interface)
  webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: etech-nexus-webui
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=etech-nexus-secret-key
    ports:
      - "3000:8080"
    depends_on:
      - ollama
    restart: unless-stopped
    networks:
      - etech-network

  # n8n Automation
  n8n:
    image: n8nio/n8n:latest
    container_name: etech-nexus-n8n
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=etech2026
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    networks:
      - etech-network

  # Traefik Reverse Proxy
  traefik:
    image: traefik:v3.0
    container_name: etech-nexus-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
    restart: unless-stopped
    networks:
      - etech-network

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: etech-nexus-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks:
      - etech-network

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: etech-nexus-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - etech-network

networks:
  etech-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  n8n_data:
  prometheus_data:
  grafana_data: