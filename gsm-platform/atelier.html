<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atelier | E-Tech Nexus AI</title>
    <style>
        :root { --bleu: #00D4FF; --violet: #8B5CF6; --noir: #0A0A0A; --gris-fonce: #111; --gris-moyen: #333; --gris-clair: #888; --blanc: #FFF; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: var(--noir); color: var(--blanc); min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
        
        header { padding: 20px 0; border-bottom: 1px solid var(--gris-moyen); display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 700; }
        .logo span:nth-child(2) { color: var(--bleu); }
        
        .tabs { display: flex; gap: 8px; padding: 24px 0; border-bottom: 1px solid var(--gris-moyen); margin-bottom: 24px; }
        .tab { padding: 12px 24px; background: var(--gris-fonce); border: 1px solid var(--gris-moyen); border-radius: 8px; cursor: pointer; transition: all 0.3s; }
        .tab:hover, .tab.active { background: var(--bleu); border-color: var(--bleu); color: var(--noir); }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        
        .card { background: var(--gris-fonce); border-radius: 16px; padding: 24px; border: 1px solid var(--gris-moyen); }
        .card h3 { font-size: 18px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
        .card h3 .count { font-size: 14px; color: var(--bleu); background: rgba(0,212,255,0.1); padding: 4px 12px; border-radius: 12px; }
        
        .ticket { background: var(--noir); padding: 16px; border-radius: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .ticket-info h4 { font-size: 16px; margin-bottom: 4px; }
        .ticket-info p { font-size: 12px; color: var(--gris-clair); }
        .ticket-status { padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; }
        .ticket-status.pending { background: rgba(245,158,11,0.2); color: #F59E0B; }
        .ticket-status.in_progress { background: rgba(0,212,255,0.2); color: var(--bleu); }
        .ticket-status.completed { background: rgba(16,185,129,0.2); color: #10B981; }
        
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 14px; color: var(--gris-clair); margin-bottom: 8px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; background: var(--noir); border: 1px solid var(--gris-moyen); border-radius: 8px; color: var(--blanc); }
        
        .btn { width: 100%; padding: 14px; background: var(--bleu); border: none; border-radius: 8px; color: var(--noir); font-weight: 600; cursor: pointer; }
        .btn:hover { opacity: 0.9; }
        
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat { background: var(--gris-fonce); padding: 20px; border-radius: 12px; text-align: center; }
        .stat .value { font-size: 32px; font-weight: 700; color: var(--bleu); }
        .stat .label { font-size: 12px; color: var(--gris-clair); margin-top: 4px; }
        
        .client-item { background: var(--noir); padding: 16px; border-radius: 12px; margin-bottom: 8px; }
        .client-item h4 { font-size: 14px; margin-bottom: 4px; }
        .client-item p { font-size: 12px; color: var(--gris-clair); }
        
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } .stats-row { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <span>E-Tech</span><span>Nexus</span>AI
            </div>
            <a href="index.html" style="color: var(--bleu); text-decoration: none;">← Diagnostic</a>
        </header>
        
        <h1 style="margin: 24px 0; font-size: 32px;">🏠 Atelier CRM</h1>
        
        <div class="stats-row">
            <div class="stat"><div class="value" id="stat-total">0</div><div class="label">Total Tickets</div></div>
            <div class="stat"><div class="value" id="stat-pending">0</div><div class="label">En attente</div></div>
            <div class="stat"><div class="value" id="stat-progress">0</div><div class="label">En cours</div></div>
            <div class="stat"><div class="value" id="stat-completed">0</div><div class="label">Terminés</div></div>
        </div>
        
        <div class="tabs">
            <div class="tab active" onclick="showTab('tickets')">Tickets</div>
            <div class="tab" onclick="showTab('clients')">Clients</div>
            <div class="tab" onclick="showTab('nouveau')">Nouveau</div>
        </div>
        
        <div class="grid">
            <div class="card" id="tickets-panel">
                <h3>Tickets <span class="count" id="tickets-count">0</span></h3>
                <div id="tickets-list"></div>
            </div>
            
            <div>
                <div class="card" id="clients-panel" style="display: none;">
                    <h3>Clients <span class="count" id="clients-count">0</span></h3>
                    <div id="clients-list"></div>
                </div>
                
                <div class="card" id="nouveau-panel" style="display: none;">
                    <h3>➕ Nouveau Ticket</h3>
                    <form id="ticket-form">
                        <div class="form-group">
                            <label>Client</label>
                            <select name="client_id" required id="client-select"></select>
                        </div>
                        <div class="form-group">
                            <label>Appareil</label>
                            <input type="text" name="device_model" placeholder="iPhone 15 Pro" required>
                        </div>
                        <div class="form-group">
                            <label>IMEI</label>
                            <input type="text" name="imei" placeholder="123456789012345">
                        </div>
                        <div class="form-group">
                            <label>Type de problème</label>
                            <select name="issue_type" required>
                                <option value="">Sélectionner...</option>
                                <option value="ecran">Écran cassée</option>
                                <option value="battery">Batterie</option>
                                <option value="camera">Caméra</option>
                                <option value="reseau">Réseau</option>
                                <option value="tactile">Tactile</option>
                                <option value="charge">Charge</option>
                                <option value="autre">Autre</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Description</label>
                            <textarea name="description" placeholder="Décrire le problème..."></textarea>
                        </div>
                        <div class="form-group">
                            <label>Prix estimé ($)</label>
                            <input type="number" name="estimated_price" placeholder="0">
                        </div>
                        <button type="submit" class="btn">Créer le ticket</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let tickets = [];
        let clients = [];
        
        async function loadData() {
            try {
                tickets = await fetch('http://localhost:3001/api/tickets').then(r => r.json());
                clients = await fetch('http://localhost:3001/api/clients').then(r => r.json());
            } catch(e) { tickets = []; clients = []; }
            updateUI();
        }
        
        function updateUI() {
            document.getElementById('stat-total').textContent = tickets.length;
            document.getElementById('stat-pending').textContent = tickets.filter(t => t.status === 'pending').length;
            document.getElementById('stat-progress').textContent = tickets.filter(t => t.status === 'in_progress').length;
            document.getElementById('stat-completed').textContent = tickets.filter(t => t.status === 'completed').length;
            
            document.getElementById('tickets-count').textContent = tickets.length;
            document.getElementById('clients-count').textContent = clients.length;
            
            // Render tickets
            document.getElementById('tickets-list').innerHTML = tickets.map(t => `
                <div class="ticket">
                    <div class="ticket-info">
                        <h4>${t.device_model}</h4>
                        <p>${t.issue_type} • ${t.description?.substring(0,50) || ''}</p>
                    </div>
                    <span class="ticket-status ${t.status}">${t.status}</span>
                </div>
            `).join('') || '<p style="color: var(--gris-clair);">Aucun ticket</p>';
            
            // Render clients
            document.getElementById('clients-list').innerHTML = clients.map(c => `
                <div class="client-item">
                    <h4>${c.name}</h4>
                    <p>${c.email} • ${c.phone}</p>
                </div>
            `).join('') || '<p style="color: var(--gris-clair);">Aucun client</p>';
            
            // Populate select
            const select = document.getElementById('client-select');
            select.innerHTML = '<option value="">Sélectionner un client...</option>' + 
                clients.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        }
        
        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tickets-panel').style.display = tab === 'tickets' ? 'block' : 'none';
            document.getElementById('clients-panel').style.display = tab === 'clients' ? 'block' : 'none';
            document.getElementById('nouveau-panel').style.display = tab === 'nouveau' ? 'block' : 'none';
        }
        
        document.getElementById('ticket-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const data = {
                client_id: form.client_id.value,
                device_model: form.device_model.value,
                imei: form.imei.value,
                issue_type: form.issue_type.value,
                description: form.description.value,
                estimated_price: parseFloat(form.estimated_price.value) || null
            };
            try {
                await fetch('http://localhost:3001/api/tickets', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                form.reset();
                loadData();
            } catch(err) { alert('Erreur!'); }
        });
        
        loadData();
    </script>
</body>
</html>
